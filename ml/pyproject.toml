[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "ta-lib>=0.8.1",
    "torch>=2.14.0",
    "xgboost>=3.4.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
